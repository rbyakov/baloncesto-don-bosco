name: Update data

on:
  schedule:
    # Player box scores (the page gets scores/standings live by itself).
    # Weekends: every 30 min, 08–22 Spain time. Weekdays: 4 times a day (some games are on weekday evenings).
    - cron: "7,37 6-20 * * 0,6"
    - cron: "17 7,13,19,22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, config.json, .github/workflows/update-data.yml]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build data.json from FBCV
        run: node scripts/build-data.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "data: update from FBCV"
          git push
