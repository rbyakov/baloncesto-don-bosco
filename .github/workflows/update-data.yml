name: Update data

on:
  schedule:
    # Player box scores (the page gets scores/standings live by itself).
    # Weekends: every 30 min, 08–22 Spain time. Weekdays: 4 times a day (some games are on weekday evenings).
    - cron: "7,37 6-20 * * 0,6"
    - cron: "17 7,13,19,22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, config.json, .github/workflows/update-data.yml]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build data.json from FBCV
        run: node scripts/build-data.mjs
      - name: Build data for the other club teams (A, C)
        run: |
          for id in $(node -e 'console.log((require("./config.json").otherTeams||[]).map(t=>t.id).join(" "))'); do
            node scripts/build-data.mjs "$id" || echo "::warning::team $id failed"
          done
        continue-on-error: true
      - name: Build league.json (group + league rankings, at most once a day)
        run: node scripts/build-league.mjs
        continue-on-error: true
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- 'data*.json' league.json)" ]; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data*.json league.json
          git commit -m "data: update from FBCV"
          git push
